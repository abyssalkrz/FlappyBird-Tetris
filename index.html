<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Game Giải Trí</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mhoangg's Game</h1>
        
        <!-- Thanh chọn trò chơi -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchGame('tetris')">Tetris</button>
            <button class="tab-btn" onclick="switchGame('flappy')">Flappy Bird</button>
        </div>

        <!-- Khu vực chơi Tetris -->
        <div id="tetris-area" class="game-area">
            <div class="game-wrapper">
                <canvas id="tetris-canvas" width="240" height="400"></canvas>
                <div class="game-info">
                    <h2>TETRIS</h2>
                    <p>Điểm: <span id="tetris-score">0</span></p>
                    <button class="control-btn" onclick="startTetris()">Chơi mới</button>
                    <div class="instructions">
                        <p><strong>Cách chơi:</strong></p>
                        <p>← → : Di chuyển</p>
                        <p>↑ : Xoay khối</p>
                        <p>↓ : Rơi nhanh</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Khu vực chơi Flappy Bird -->
        <div id="flappy-area" class="game-area hidden">
            <div class="game-wrapper">
                <canvas id="flappy-canvas" width="320" height="480"></canvas>
                <div class="game-info">
                    <h2>BIRD DTRUNG</h2>
                    <p>Điểm: <span id="flappy-score">0</span></p>
                    <button class="control-btn" onclick="startFlappy()">Chơi mới</button>
                    <div class="instructions">
                        <p><strong>Cách chơi:</strong></p>
                        <p>Phím Space (Cách) hoặc Click chuột vào màn hình game để bay lên.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng các file script -->
    <script src="tetris.js"></script>
    <script src="flappy.js"></script>
    <script>
        // Logic chuyển đổi qua lại giữa 2 game
        function switchGame(gameName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.game-area').forEach(area => area.classList.add('hidden'));

            if (gameName === 'tetris') {
                document.querySelector('[onclick="switchGame(\'tetris\')"]').classList.add('active');
                document.getElementById('tetris-area').classList.remove('hidden');
                stopFlappyGame(); // Dừng game kia để tránh tốn tài nguyên
                startTetris();
            } else {
                document.querySelector('[onclick="switchGame(\'flappy\')"]').classList.add('active');
                document.getElementById('flappy-area').classList.remove('hidden');
                stopTetrisGame(); // Dừng game kia
                startFlappy();
            }
        }

        // Ngăn trang web tự động cuộn lên xuống khi nhấn phím mũi tên hoặc Space
        window.addEventListener('keydown', function(e) {
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }
        }, false);

        // Khởi chạy game đầu tiên khi tải trang
        window.onload = () => {
            startTetris();
        };
    </script>
</body>
</html>
